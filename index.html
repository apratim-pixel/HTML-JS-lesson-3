<!DOCTYPE html>
<html lang="en">
    <head>
       
        <title>Tutorial</title>
        <style>
            .alert {
               color: aqua; 
               background: green;
               padding: 5px;
            }
             .tip {
               color: purple;
             }
        </style>
    </head>
    <body>
        <h1 id="heading">Welcome</h1>
        <p class="intro">Hello</p>
        <p>How are you?</p>
        <script>
            //step 1: create a division and add it to the end of the body
            let div = document.createElement("div");
            div.className = "alert";
            div.innerHTML = "<p>Congrats! You have created a div.</p>";
            document.body.append(div);

            //step 2: find the heading by id and change it
            let heading = document.getElementById("heading");
            heading.innerHTML = '&#128512;';

            //step 3: find the first element by matching the CSS selector and change it
            document.querySelector(".intro").innerHTML = "<strong>Good job!</strong>";

            //step 4: create an h2 element with the class "tip" and add it to the start of the body
            let tip = document.createElement('h2');
            tip.className = "tip";
            tip.innerHTML = "Tip of the day";
            document.body.prepend(tip);
        </script>    
    </body>
</html>
